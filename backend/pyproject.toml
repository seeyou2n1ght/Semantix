[project]
name = "semantix-engine"
version = "0.8.0"
description = "Semantix Engine - 本地语义检索与知识关联计算引擎"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "sentence-transformers>=3.0.1",
    "lancedb>=0.29.2",
    "pylance>=4.0.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12.3",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
