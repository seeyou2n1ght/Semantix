[project]
name = "semantix-engine"
version = "0.9.1"
description = "Semantix Engine - 本地语义检索与知识关联计算引擎"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "sentence-transformers>=3.0.1",
    "lancedb>=0.29.2",
    "pylance>=4.0.0",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "gpu" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::SyntaxWarning:jieba.*",
]

